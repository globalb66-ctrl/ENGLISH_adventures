<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Little Explorers · Say It!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* One bright sky-and-sun world for the kids (deliberately light-only). Big touch targets, one task per screen. */
:root{color-scheme:light;--sky:#EAF6FF;--sky2:#BFE6FF;--card:#fff;--coral:#FF6B6B;--sun:#FFD166;--grass:#06D6A0;--violet:#9B5DE5;--navy:#1B4965;--soft:#5B7C99;--line:#E3EDF5;
--kid:var(--violet);--kidd:#7a3fc4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--navy);font-family:'Nunito',system-ui,sans-serif}
body{min-height:100vh;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.mohamed{--kid:#FF6B6B;--kidd:#d24f4f}
body.noura{--kid:#06A77D;--kidd:#04866a}
.wrap{max-width:620px;margin:0 auto}
h1,h2,.baloo{font-family:'Baloo 2',system-ui,sans-serif}
h1{font-weight:800;font-size:clamp(30px,7vw,46px);line-height:1.05;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;gap:8px}
.iconbtn{border:0;background:#fff;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 3px 0 rgba(27,73,101,.12)}
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky2),var(--sky));margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:30px 20px 28px;text-align:center}
.hero .sun{position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:var(--sun);border-radius:50%;box-shadow:0 0 0 14px rgba(255,209,102,.35)}
.hero p{font-size:18px;font-weight:700;color:var(--soft);margin:10px auto 0;max-width:30ch;position:relative}
.hero h1{position:relative}
.kids{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.kidc{border:0;border-radius:24px;padding:16px 6px 14px;background:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(27,73,101,.10);display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:var(--navy)}
.kidc .av{font-size:clamp(44px,13vw,64px);line-height:1}
.kidc b{font-family:'Baloo 2',system-ui,sans-serif;font-size:clamp(19px,5.5vw,26px);font-weight:800}
.kidc.m{border-bottom:6px solid var(--violet)}.kidc.o{border-bottom:6px solid var(--coral)}.kidc.n{border-bottom:6px solid #06A77D}
.kidc .stars{font-weight:800;color:var(--soft);font-size:12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{border:2px solid transparent;background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-weight:800;font-size:15px;color:var(--navy);cursor:pointer;box-shadow:0 3px 0 rgba(27,73,101,.10)}
.chip.on{background:var(--navy);color:#fff}
.lbl{text-align:center;font-weight:800;color:var(--soft);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:18px}
.link{display:block;text-align:center;margin:18px auto 0;font-weight:800;color:var(--soft);background:none;border:0;font:inherit;font-weight:800;cursor:pointer;text-decoration:underline}
/* game */
.progress{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.progress span{font-size:34px;filter:grayscale(1);opacity:.3;transition:transform .3s}
.progress span.on{filter:none;opacity:1;transform:scale(1.15)}
.tier{display:inline-block;border-radius:999px;padding:6px 16px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:18px;color:#fff;background:var(--grass);margin-top:8px}.tier.good{background:#f4a623}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}.rules div{background:#fff;border-radius:18px;padding:10px;text-align:center;font-weight:800;box-shadow:0 3px 0 rgba(27,73,101,.08)}.rules b{display:block;font-family:'Baloo 2',system-ui,sans-serif;font-size:24px}
.who{display:flex;align-items:center;gap:10px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:22px}
.who .av{font-size:34px}
.pc{background:#fff;border-radius:30px;padding:22px 18px;text-align:center;box-shadow:0 8px 0 rgba(27,73,101,.08);border:4px dashed #FFD8D8;margin-top:6px}
.pc .em{font-size:84px;line-height:1.1}
.pc .en{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:20px;color:var(--soft);margin-top:4px}
.pc .say{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.15;margin:8px 0 2px;overflow-wrap:anywhere}
.pc .pron{font-weight:700;color:var(--soft);font-size:17px}
.pc .flag{font-size:22px}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:16px}
.big{border:0;border-radius:22px;min-height:76px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--navy);background:#fff;box-shadow:0 5px 0 rgba(27,73,101,.15)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(27,73,101,.15)}
.big.mic{background:var(--kid);color:#fff;box-shadow:0 5px 0 var(--kidd)}
.big.mic.rec{background:var(--grass);box-shadow:0 5px 0 #04a57b;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.big:focus-visible,.chip:focus-visible,.kidc:focus-visible,.iconbtn:focus-visible{outline:4px solid var(--navy);outline-offset:3px}
.fb{min-height:64px;text-align:center;margin-top:14px;font-weight:800;font-size:20px}
.fb .heard{display:block;font-size:15px;color:var(--soft);font-weight:700;margin-top:4px}
.fb.ok{color:#04976f}.fb.no{color:var(--coral)}
.parentrow{display:flex;gap:10px;justify-content:center;margin-top:8px}
.small{border:0;background:#fff;border-radius:14px;padding:10px 14px;font:inherit;font-weight:800;color:var(--navy);cursor:pointer;box-shadow:0 3px 0 rgba(27,73,101,.10);min-height:44px}
/* reward */
.reward{text-align:center;padding-top:20px}
.reward .trophy{font-size:96px;animation:bounce 1.2s infinite}
@keyframes bounce{50%{transform:translateY(-12px)}}
.reward h1{color:var(--kid)}
.tablet{background:#fff;border-radius:30px;padding:22px;margin:20px 0;box-shadow:0 8px 0 rgba(27,73,101,.08)}
.clock{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(64px,20vw,110px);line-height:1;font-variant-numeric:tabular-nums;color:var(--navy)}
.bar{height:16px;border-radius:9px;background:var(--line);overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;background:var(--grass);border-radius:9px;transition:width 1s linear}
/* words + settings */
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.wc{background:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(27,73,101,.06)}
.wc .e{font-size:30px}.wc b{display:block;font-size:16px;overflow-wrap:anywhere}.wc small{color:var(--soft);font-weight:700}.wc .x{margin-left:auto}
.wc.done{outline:3px solid var(--grass)}
.panel{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 4px 0 rgba(27,73,101,.06)}
.panel label{display:block;font-weight:800;margin:10px 0 4px;color:var(--soft);font-size:14px}
.panel input,.panel select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);padding:8px 12px;font:inherit;font-size:16px;color:var(--navy);background:#fff}
.hint{color:var(--soft);font-weight:600;font-size:14px;margin:6px 0}
.warn{background:#FFF4D6;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;margin:10px 0}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<label for="sgood">Minutes for a good round ⭐ (finished with some tries again)</label><input id="sgood" type="number" min="1" max="180" value="${S.good}" onchange="S.good=Math.max(1,Math.min(180,+this.value||10));save()">
<label for="slevel">How strict is listening?</label><select id="slevel" onchange="S.level=this.value;save()">${[['easy','Easy · little ones, accents OK'],['normal','Normal'],['strict','Strict · nearly exact']].map(([k,l])=>`<option value="${k}"${S.level==k?' selected':''}>${l}</option>`).join('')}</select>
<label for="scheck">Who checks the phrase?</label><select id="scheck" onchange="S.check=this.value;save()"><option value="voice"${S.check=='voice'?' selected':''}${SR?'':' disabled'}>The phone listens (microphone)</option><option value="parent"${S.check=='parent'?' selected':''}>A grown-up taps ✅</option></select>
${SR?'<p class="hint">Listening uses Chrome\'s speech service, so it needs the internet.</p>':'<p class="hint">This browser cannot listen. Open the file in Chrome on Android to use the microphone.</p>'}</div>
<div class="panel">${Object.entries(KIDS).map(([k,c])=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0"><span style="font-size:30px">${c.av}</span><b style="flex:1">${c.n}: ⭐ ${S.kids[k].stars} · ${S.kids[k].won.length} words · ${S.kids[k].rounds} wins (${S.kids[k].perfects||0} perfect)</b><button class="small" id="rs-${k}" onclick="resetKid('${k}',this)">Reset</button></div>`).join('')}</div>`}
function resetKid(k,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Sure?';return}S.kids[k]={stars:0,won:[],rounds:0};save();go('settings')}
function words(){const l=S.lang;return`<div class="top"><h1 style="font-size:30px">All 50 words</h1><button class="iconbtn" aria-label="Home" onclick="go()">🏠</button></div>
<div class="chips">${Object.entries(LANGS).map(([k,x])=>`<button class="chip ${l==k?'on':''}" onclick="S.lang='${k}';save();go('words')">${x.f}</button>`).join('')}</div>
<p class="hint" style="text-align:center">Green = learned by Malak, Mohamed or Noura. Tap 🔊 to hear.</p>
<div class="wl">${DATA.map((d,i)=>{const done=Object.values(S.kids).some(K=>K.won.includes(key(i,l)));return`<div class="wc ${done?'done':''}"><span class="e">${d.emoji}</span><span style="min-width:0"><b dir="auto">${esc(d[l])}</b><small>${esc(l=='en'?'':d.en)}${d[l+'P']?' · '+esc(d[l+'P']):''}</small></span><button class="small x" aria-label="Listen" onclick="speak(${JSON.stringify(d[l]).replace(/"/g,'&quot;')},'${l}')">🔊</button></div>`}).join('')}</div>`}

let VIEW='';
function go(v){VIEW=v||'';stopRec();const V={play,reward:()=>reward(!!(S.timer&&S.timer.end>Date.now())),settings,words}[VIEW]||home;$('#app').innerHTML=V();scrollTo(0,0)}
go();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script></body>
</html>
